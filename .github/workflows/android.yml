# Builds the Android app (phones + Android TV) and, when the Play secrets are set, uploads it
# to the internal testing track of Google Play. Production is released by hand in Play Console.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    upload key (.jks) in base64
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS  ANDROID_KEY_PASSWORD  optional: default to "upload" and the keystore password
#   GOOGLE_SERVICES_JSON       Firebase android/app/google-services.json (optional: without it, no notifications)
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play API service account (optional: without it, download the .aab from the run)
name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      # Google Play needs a higher version code on every upload; the old app is at 17.
      - run: echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Signing key and Firebase file
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            # A pasted secret can carry line breaks, spaces, quotes or a byte-order mark: keep only base64 characters.
            if ! printf '%s' "$KEYSTORE" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not the keystore: paste the whole content of ANDROID_KEYSTORE_BASE64.txt again."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$(printf '%s' "$STOREPASS" | tr -d '\r\n')" > /dev/null 2>&1; then
              echo "::error::The keystore does not open with ANDROID_KEYSTORE_PASSWORD (or the keystore secret is cut short): paste both secrets again."
              exit 1
            fi
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 – the build is signed with a debug key and cannot go to Google Play."
          fi
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > android/app/google-services.json
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build appbundle --release --build-number=$BUILD_NUMBER --dart-define=BUILD_NUMBER=$BUILD_NUMBER
          flutter build apk --release --build-number=$BUILD_NUMBER --dart-define=BUILD_NUMBER=$BUILD_NUMBER

      - name: Check the notification resources in the APK
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)aapt2
          $AAPT2 dump resources build/app/outputs/flutter-apk/app-release.apk > res.txt
          grep -n -i "ic_notification\|audio_service_\|tv_banner" res.txt | head -40 || true
          echo "--- total drawables:"; grep -c "resource .*drawable/" res.txt || true
          $AAPT2 dump xmltree --file AndroidManifest.xml build/app/outputs/flutter-apk/app-release.apk | grep -n -i -A3 "service\|ic_notification\|targetSdk" | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: kahol-yavan-${{ env.BUILD_NUMBER }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.chagil.kahol_yavan_radio_app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
